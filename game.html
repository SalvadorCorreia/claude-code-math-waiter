<!DOCTYPE html>
<html>
<head>
<title>Math Waiter</title>
<style>
  :root {
    --bg: #1e1e2e;
    --text: #cdd6f4;
    --accent: #89b4fa;
    --danger: #f38ba8;
    --warning: #f9e2af;
    --success: #a6e3a1;
    --surface: #313244;
    --overlay: rgba(30, 30, 46, 0.95);
  }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    transition: background-color 0.1s;
  }
  .damage-flash {
    background-color: #5c1f2b !important;
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 1rem;
    color: var(--accent);
  }
  .stats-container {
    display: flex;
    gap: 30px;
    background: var(--surface);
    padding: 20px 40px;
    border-radius: 16px;
    margin-bottom: 30px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    align-items: center;
  }
  .stats {
    font-size: 2rem;
    font-weight: bold;
  }
  #hearts-container {
    display: flex;
    gap: 10px;
  }
  .heart {
    width: 36px;
    height: 36px;
    fill: var(--danger);
  }
  .heart-empty {
    fill: none;
    stroke: var(--danger);
    stroke-width: 2;
  }
  .game-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 400px;
  }
  #question {
    font-size: 4rem;
    margin: 0 0 20px 0;
    letter-spacing: 2px;
  }
  .timer-container {
    width: 100%;
    height: 10px;
    background: var(--surface);
    border-radius: 5px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  #timer-bar {
    height: 100%;
    width: 100%;
    background: var(--success);
    transition: width 0.1s linear, background-color 0.3s;
  }
  .input-group {
    display: flex;
    gap: 15px;
    width: 100%;
    justify-content: center;
  }
  input {
    font-size: 2rem;
    padding: 10px 20px;
    width: 150px;
    text-align: center;
    border: 2px solid var(--surface);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus {
    border-color: var(--accent);
  }
  button {
    font-size: 1.5rem;
    padding: 10px 25px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--bg);
    cursor: pointer;
    font-weight: bold;
  }
  button:hover {
    opacity: 0.8;
  }
  
  #modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: var(--overlay);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .modal-content {
    background: var(--surface);
    padding: 30px 40px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    min-width: 350px;
  }
  .modal-content h2 {
    margin-top: 0;
    color: var(--danger);
    font-size: 2rem;
  }
  .modal-content p {
    font-size: 1.2rem;
    margin: 10px 0 20px 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
  }
  th, td {
    padding: 8px;
    border-bottom: 1px solid #45475a;
    text-align: center;
    font-size: 0.95rem;
  }
  th {
    color: var(--accent);
  }
</style>
</head>
<body>
  <h1>Math Waiter</h1>
  
  <div class="stats-container">
    <div class="stats">Score: <span id="scoreDisplay">0</span></div>
    <div id="hearts-container"></div>
  </div>
  
  <div class="game-area">
    <h2 id="question"></h2>
    
    <div class="timer-container">
      <div id="timer-bar"></div>
    </div>
    
    <div class="input-group">
      <input type="number" id="answer" autofocus autocomplete="off">
      <button onclick="checkAnswer()">Submit</button>
    </div>
  </div>

  <div id="modal">
    <div class="modal-content">
      <h2>Round Over</h2>
      <p>Final Score: <strong id="modalScore">0</strong></p>
      
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Score</th>
            <th>Timestamp</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
        </tbody>
      </table>

      <button onclick="resetGame()">Play Again</button>
    </div>
  </div>

  <script>
    let score = 0;
    let leaderboard = JSON.parse(localStorage.getItem('mathLeaderboard')) || [];
    let lives = 3;
    let currentAnswer = 0;
    let totalTime = 10;
    let timeLeft = 10;
    let timerInterval;

    const timerBar = document.getElementById('timer-bar');
    const heartFull = '<svg class="heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
    const heartEmpty = '<svg class="heart heart-empty" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

    function updateUI() {
      document.getElementById('scoreDisplay').innerText = score;
      let heartsHtml = '';
      for (let i = 0; i < 3; i++) {
        heartsHtml += (i < lives) ? heartFull : heartEmpty;
      }
      document.getElementById('hearts-container').innerHTML = heartsHtml;
    }

    function setProgress(percent) {
      timerBar.style.width = percent + '%';
      
      if (percent > 50) {
        timerBar.style.backgroundColor = 'var(--success)';
      } else if (percent > 20) {
        timerBar.style.backgroundColor = 'var(--warning)';
      } else {
        timerBar.style.backgroundColor = 'var(--danger)';
      }
    }

    function startTimer() {
      clearInterval(timerInterval);
      
      totalTime = Math.max(10 - Math.floor(score / 10), 3); 
      timeLeft = totalTime;
      setProgress(100);
      
      timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        setProgress((timeLeft / totalTime) * 100);
        
        if (timeLeft <= 0) {
          triggerDamage();
        }
      }, 100);
    }

    function triggerDamage() {
      document.body.classList.add('damage-flash');
      setTimeout(() => {
        document.body.classList.remove('damage-flash');
      }, 150);
      handleWrong();
    }

    function handleWrong() {
      lives--;
      updateUI();
      if (lives <= 0) {
        gameOver();
      } else {
        generateQuestion();
      }
    }

    function saveScore() {
      const now = new Date();
      const dateStr = now.toLocaleDateString();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const timestamp = `${dateStr} ${timeStr}`;
      
      leaderboard.push({ score: score, timestamp: timestamp });
      leaderboard.sort((a, b) => b.score - a.score);
      leaderboard = leaderboard.slice(0, 10);
      localStorage.setItem('mathLeaderboard', JSON.stringify(leaderboard));
    }

    function renderLeaderboard() {
      const tbody = document.getElementById('leaderboardBody');
      tbody.innerHTML = '';
      
      if (leaderboard.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3">No scores yet</td></tr>';
        return;
      }

      leaderboard.forEach((entry, index) => {
        const row = `<tr>
          <td>${index + 1}</td>
          <td>${entry.score}</td>
          <td>${entry.timestamp}</td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    function gameOver() {
      clearInterval(timerInterval);
      saveScore();
      renderLeaderboard();
      
      document.getElementById('modalScore').innerText = score;
      document.getElementById('modal').style.display = 'flex';
      document.getElementById('answer').blur();
    }

    function resetGame() {
      document.getElementById('modal').style.display = 'none';
      score = 0;
      lives = 3;
      generateQuestion();
    }

    function generateQuestion() {
      updateUI();
      
      let ops = ['+'];
      let maxNum = 20 + (score * 2);
      
      if (score >= 2) ops.push('-');
      if (score >= 5) { ops.push('*'); maxNum = 12 + Math.floor(score / 2); }
      if (score >= 8) { ops.push('/'); maxNum = 20 + score; }
      if (score >= 40) { ops.push('^2', '√'); }
      
      let op = ops[Math.floor(Math.random() * ops.length)];
      let a, b;
      let questionText = "";

      if (op === '+') {
        a = Math.floor(Math.random() * (maxNum - 10)) + 10;
        b = Math.floor(Math.random() * (maxNum - 10)) + 10;
        currentAnswer = a + b;
        questionText = a + ' + ' + b;
      } else if (op === '-') {
        a = Math.floor(Math.random() * (maxNum - 10)) + 10;
        let maxB = a - 1;
        b = Math.floor(Math.random() * (maxB - 10 + 1)) + 10;
        if (b < 10) b = 10;
        currentAnswer = a - b;
        questionText = a + ' - ' + b;
      } else if (op === '*') {
        let maxFactor = Math.min(maxNum, 12);
        a = Math.floor(Math.random() * (maxFactor - 1)) + 2; 
        b = Math.floor(Math.random() * (maxFactor - 1)) + 2;
        currentAnswer = a * b;
        questionText = a + ' * ' + b;
      } else if (op === '/') {
        let maxDivisor = Math.min(maxNum, 12);
        b = Math.floor(Math.random() * (maxDivisor - 1)) + 2;
        currentAnswer = Math.floor(Math.random() * 11) + 2;
        a = b * currentAnswer; 
        questionText = a + ' / ' + b;
      } else if (op === '^2') {
        a = Math.floor(Math.random() * 15) + 2;
        currentAnswer = a * a;
        questionText = a + '²';
      } else if (op === '√') {
        currentAnswer = Math.floor(Math.random() * 15) + 2;
        a = currentAnswer * currentAnswer;
        questionText = '√' + a;
      }
      
      document.getElementById('question').innerText = questionText;
      document.getElementById('answer').value = '';
      document.getElementById('answer').focus();
      startTimer();
    }

    function checkAnswer() {
      let userAns = parseInt(document.getElementById('answer').value);
      if (userAns === currentAnswer) {
        score++;
        generateQuestion();
      } else {
        triggerDamage();
      }
    }

    document.getElementById('answer').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkAnswer();
    });

    generateQuestion();
  </script>
</body>
</html>
